services:
  redis:
    image: redis:7-alpine
  web:
    build: .
    command: gunicorn goharvest.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - harvest-media:/app/media
  worker:
    build: .
    command: celery -A goharvest worker -l info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - harvest-media:/app/media
volumes:
  harvest-media:
